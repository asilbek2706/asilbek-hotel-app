<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Hotel bron qilish sahifasi - narx kalkulyatori va formalar."
    />
    <title>Hotel | Bron qilish</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/main.js" defer></script>
  </head>
  <body>
    <header class="site-header" data-header>
      <div class="container nav-shell">
        <a class="brand" href="index.html"
          ><span class="brand-mark">H</span
          ><span class="brand-text">Hotel</span></a
        >
        <button
          class="nav-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="site-nav"
        >
          <span></span><span></span><span></span>
          <span class="sr-only">Menyuni ochish</span>
        </button>
        <nav class="site-nav" id="site-nav" data-nav>
          <a href="index.html">Bosh sahifa</a>
          <a href="rooms.html">Xonalar</a>
          <a class="active" href="booking.html">Bron qilish</a>
          <a href="about.html">Biz haqimizda</a>
          <a href="contact.html">Aloqa</a>
        </nav>
      </div>
    </header>

    <main class="section" data-reveal>
      <div class="container booking-layout">
        <section class="card form-card">
          <p class="eyebrow">Bron qilish</p>
          <h1>Safarni tez hisoblab bron qiling.</h1>
          <form class="booking-form" data-booking-form>
            <label>
              Xona turi
              <select name="roomType" data-room-select>
                <option value="90">Standard Room</option>
                <option value="140">Deluxe Room</option>
                <option value="180">Family Deluxe</option>
                <option value="220">Executive Suite</option>
              </select>
            </label>
            <label>
              Kelish sanasi
              <input type="date" name="checkIn" data-check-in required />
            </label>
            <label>
              Ketish sanasi
              <input type="date" name="checkOut" data-check-out required />
            </label>
            <label>
              Mehmonlar soni
              <input
                type="number"
                name="guests"
                min="1"
                max="6"
                value="2"
                required
              />
            </label>
            <button class="btn btn-primary" type="submit">Hisoblash</button>
          </form>
        </section>

        <aside class="card summary-card">
          <h2>Bron xulosasi</h2>
          <div class="summary-row">
            <span>Bir kecha narxi</span>
            <strong data-night-price>$90</strong>
          </div>
          <div class="summary-row">
            <span>Taxminiy jami</span>
            <strong data-total-price>$0</strong>
          </div>
          <p class="summary-note" data-booking-note>
            Hotel bron summasi sanalar va xona turiga qarab avtomatik
            hisoblanadi.
          </p>
        </aside>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container footer-grid">
        <p>&copy; <span data-year></span> Hotel.</p>
        <p>Hotel bron qilish formasi va narx kalkulyatori.</p>
      </div>
    </footer>
  </body>
</html>
